services:
  db:
    image: postgres:16-alpine
    # bulk imports write ~1 GB: bigger WAL and buffers avoid constant checkpoints.
    # Durability unchanged (synchronous_commit stays on).
    command: ["postgres", "-c", "max_wal_size=4GB", "-c", "shared_buffers=512MB"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.example)}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-meridian};Username=${POSTGRES_USER:-meridian};Password=${POSTGRES_PASSWORD}
      Storage__Path: /app/uploads
      # workstation GC: much lower memory in a container than the server GC default
      DOTNET_gcServer: "0"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - file-storage:/app/uploads   # uploaded files survive container rebuilds
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-4200}:80"
    depends_on:
      - api

volumes:
  db-data:
  file-storage:
